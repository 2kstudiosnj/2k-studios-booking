<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Cancelled | 2K STUDIOS</title>
  <meta
    name="description"
    content="Your 2K Studios booking checkout was cancelled."
  />
  <style>
    :root {
      --bg: #080808;
      --card: #141414;
      --gold: #d6a85f;
      --gold-soft: #f0d29a;
      --text: #f7f3eb;
      --muted: #b7b0a3;
      --line: rgba(214, 168, 95, 0.22);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(214, 168, 95, 0.12), transparent 30%),
        linear-gradient(180deg, #050505 0%, #0b0b0b 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92%, 720px);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 18px;
      border: 1px solid var(--line);
      background: #0b0b0b;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--gold-soft);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 18px;
      margin: 22px 0;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f3d59f, #c38b38);
      color: #111;
    }

    .btn-outline {
      border: 1px solid var(--line);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/logo.PNG" alt="2K Studios logo" class="logo" />
    <span class="badge">Checkout Cancelled</span>
    <h1>Your booking was not completed</h1>
    <p>
      No worries. Your checkout was cancelled before payment was finished.
    </p>

    <div class="box">
      <p>
        You can return to the booking page and try again whenever you're ready.
      </p>
    </div>

    <div class="actions">
      <a href="/booking.html" class="btn btn-primary">Try Again</a>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </div>
  </div>
</body>
</html>
